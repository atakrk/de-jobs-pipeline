services:
  postgres:
    image: postgres:16-alpine
    container_name: de_jobs_postgres
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
    ports:
      # 5433 on the host so it does not clash with a local PostgreSQL install
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
