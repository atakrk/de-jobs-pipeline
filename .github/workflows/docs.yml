name: docs

# dbt docs, regenerated only when the dbt project changes.
# Needs a database because docs read column types from the warehouse.
# Publishes under docs/models/; docs/index.html belongs to the dashboard.

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobs
          POSTGRES_USER: jobs
          POSTGRES_PASSWORD: jobs
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobs -d jobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5433
      PGDATABASE: jobs
      PGUSER: jobs
      PGPASSWORD: jobs

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Docs need column types, so build the models empty.
      - name: Create empty relations
        working-directory: dbt
        run: |
          python ../load/create_schema_only.py
          dbt seed --profiles-dir .
          dbt run --profiles-dir . --empty

      - name: Generate docs
        working-directory: dbt
        run: |
          dbt docs generate --profiles-dir .
          mkdir -p ../docs/models
          cp target/index.html target/manifest.json target/catalog.json ../docs/models/
          touch ../docs/.nojekyll

      # Strip the broken canonical and add noindex; fail if either didn't apply.
      # GNU sed (Ubuntu runner).
      - name: Keep the model docs out of search results
        run: |
          page=docs/models/index.html
          sed -i '0,/<link rel="canonical"[^>]*>/s///' "$page"
          sed -i '0,/<head>/s//<head><meta name="robots" content="noindex">/' "$page"
          grep -q '<meta name="robots" content="noindex">' "$page"
          # Not `! grep`: bash -e does not stop on a negated command.
          if grep -q '<link rel="canonical"' "$page"; then exit 1; fi

      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/models docs/.nojekyll
          if git diff --staged --quiet; then
            echo "docs unchanged"
            exit 0
          fi
          git commit -m "Regenerate model documentation"
          git pull --rebase origin main
          git push origin HEAD:main
