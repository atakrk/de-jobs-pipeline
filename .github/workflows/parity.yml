name: parity

# Builds the same fixture on Postgres and Databricks and diffs the output.
# A wrong dialect rewrite still compiles, so only a diff catches it.
# Manual only, since Databricks is optional. Run it when a dialect macro changes.

on:
  workflow_dispatch:

concurrency:
  # The fixture truncates its tables, so never run two at once.
  group: databricks-parity
  cancel-in-progress: false

jobs:
  fixture-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobs
          POSTGRES_USER: jobs
          POSTGRES_PASSWORD: jobs
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobs -d jobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5433
      PGDATABASE: jobs
      PGUSER: jobs
      PGPASSWORD: jobs

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the fixture on Postgres
        run: python scripts/fixture.py --load --dump /tmp/postgres

      - name: Build the fixture on Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
          # fixture_* schemas, so it can't touch the real tables.
          RAW_SCHEMA: fixture_raw
          DATABRICKS_SCHEMA: fixture
        run: python scripts/fixture.py --target databricks --load --dump /tmp/databricks

      - name: Diff
        run: |
          if diff -r /tmp/postgres /tmp/databricks; then
            echo "engines agree on all models"
          else
            echo
            echo "The two engines disagree. Fix the macro in dbt/macros/dialect.sql;"
            echo "do not edit a model to make the diff go away -- that hides the"
            echo "disagreement instead of removing it."
            exit 1
          fi
