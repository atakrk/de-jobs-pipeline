name: daily

# The point of running this on a schedule is not the data alone. It is that
# dbt's tests run every morning against a live third-party API. If the source
# changes shape -- a renamed field, a moved endpoint, an auth change -- the
# build goes red and says so, instead of the numbers quietly drifting.

on:
  schedule:
    # 05:40 UTC. Not on the hour: GitHub's scheduler is busiest then and
    # delays cron jobs accordingly.
    - cron: "40 5 * * *"
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobs
          POSTGRES_USER: jobs
          POSTGRES_PASSWORD: jobs
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobs -d jobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5433
      PGDATABASE: jobs
      PGUSER: jobs
      PGPASSWORD: jobs
      # Gentler than the local default: this is someone else's public service
      # and nobody is waiting on the result.
      REQUEST_DELAY_SECONDS: "1.0"

    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the branch, not the triggering commit. A re-run of an
          # older run would otherwise land on a detached HEAD behind main and
          # fail at the push.
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest
        run: |
          python ingest/arbeitsagentur.py --max-pages 10 --with-details --detail-limit 900
          python ingest/arbeitnow.py --max-pages 5

      - name: Load
        run: python load/load_raw.py

      - name: Build and test
        working-directory: dbt
        run: |
          dbt seed --profiles-dir .
          dbt build --profiles-dir .

      - name: Generate docs site
        working-directory: dbt
        run: |
          dbt docs generate --profiles-dir .
          mkdir -p ../docs
          # index.html loads the other two at runtime; these three are the
          # whole site. Copied into docs/ because GitHub Pages serves from
          # there, and regenerated every run so the lineage graph cannot
          # describe models that no longer exist.
          cp target/index.html target/manifest.json target/catalog.json ../docs/
          touch ../docs/.nojekyll

      - name: Export snapshot, charts and README figures
        run: |
          python analysis/export_snapshot.py
          python analysis/make_charts.py
          python analysis/update_readme.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots analysis/charts README.md docs
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Daily run: $(date -u +%Y-%m-%d)"
          # main can have moved while this job ran -- it takes ten minutes and
          # nobody stops working during it. Rebase rather than fail.
          git pull --rebase origin main
          git push origin HEAD:main
