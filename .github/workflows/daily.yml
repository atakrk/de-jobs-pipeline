name: daily

# Daily run: dbt tests hit the live APIs every morning, so source changes show up as a red build.
# Builds into a Postgres service container that starts empty, so the last 30 days are restored first.
# Databricks was the target until its free workspace kept failing; it's now optional, run by hand.

on:
  schedule:
    # 05:40 UTC, off the hour when GitHub's scheduler is busiest.
    - cron: "40 5 * * *"
  workflow_dispatch:

concurrency:
  # Don't cancel a run that may be pushing results.
  group: daily
  cancel-in-progress: false

permissions:
  contents: write
  # For scripts/restore_raw.py to download earlier raw artifacts.
  actions: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Mostly the ingest: 1s delay per request, ~1000 detail pages.
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobs
          POSTGRES_USER: jobs
          POSTGRES_PASSWORD: jobs
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobs -d jobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Gentler than local; it's a public API and nobody is waiting.
      REQUEST_DELAY_SECONDS: "1.0"
      PGHOST: localhost
      PGPORT: 5433
      PGDATABASE: jobs
      PGUSER: jobs
      PGPASSWORD: jobs
      # Read by analysis/warehouse.py.
      WAREHOUSE_TARGET: postgres

    steps:
      - uses: actions/checkout@v7
        with:
          # Branch, not the triggering commit, so re-runs can still push.
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Limits sit above what the search terms return, so nothing gets truncated.
      - name: Ingest
        run: |
          python ingest/arbeitsagentur.py --max-pages 20 --with-details --detail-limit 1200
          python ingest/arbeitnow.py --max-pages 5

      # Raw responses are uploaded as artifacts (90 days) before anything downstream can fail.
      # continue-on-error so the backup never blocks the load.
      # To fetch a run date locally:
      #   gh run download <run-id> -n raw-<run_date> -D data/raw
      #   python load/load_raw.py --run-date <run_date>
      - name: Name the run date
        id: run
        # Same as the ingest default (UTC).
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Keep the raw responses
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: raw-${{ steps.run.outputs.date }}
          # Downloads land back in data/raw/<source>/<run_date>/.
          path: data/raw/
          retention-days: 90
          if-no-files-found: error
          # A rerun replaces that day's copy.
          overwrite: true

      # The container starts empty, so restore the last 30 days of raw artifacts.
      - name: Restore the last thirty days
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/restore_raw.py --days 30 --until ${{ steps.run.outputs.date }}

      - name: Load
        run: python load/load_raw.py

      - name: Build and test
        working-directory: dbt
        run: |
          dbt seed --profiles-dir .
          dbt build --profiles-dir .

      # The site is rebuilt here, so it never shows stale numbers.
      - name: Export snapshot, charts, README figures and the site
        run: |
          python analysis/export_snapshot.py
          python analysis/make_charts.py
          python analysis/update_readme.py
          python site/build_site.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The site's generated files by name, never docs/ whole: robots.txt,
          # favicon.svg, CNAME and docs/models are not this job's to stage.
          git add data/snapshots analysis/charts README.md \
            docs/index.html docs/sitemap.xml docs/llms.txt docs/og.png
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Daily run: $(date -u +%Y-%m-%d)"
          # main can have moved while this job ran -- it takes ten minutes and
          # nobody stops working during it. Rebase rather than fail.
          git pull --rebase origin main
          git push origin HEAD:main
