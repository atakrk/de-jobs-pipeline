name: daily

# The point of running this on a schedule is not the data alone. It is that
# dbt's tests run every morning against a live third-party API. If the source
# changes shape -- a renamed field, a moved endpoint, an auth change -- the
# build goes red and says so, instead of the numbers quietly drifting.
#
# This used to build into a Postgres service container, which GitHub created
# empty and destroyed ten minutes later. That made every published figure one
# morning's sample: the raw layer never accumulated, so "the latest run per
# posting" and "the newest description ever fetched" had nothing to choose
# between, and the README could swing from 633 postings to 411 overnight
# because the sample moved rather than the market. It builds into Databricks
# now, which keeps thirty days and is pruned back to it by the loader.

on:
  schedule:
    # 05:40 UTC. Not on the hour: GitHub's scheduler is busiest then and
    # delays cron jobs accordingly.
    - cron: "40 5 * * *"
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Generous because the serverless warehouse cold-starts: the first
    # statement of the day waits for compute that is not running yet. The
    # answer to a slow start is a longer timeout, not dbt wrapped in retries --
    # a retry around a build turns one honest failure into three.
    timeout-minutes: 60

    env:
      # Gentler than the local default: this is someone else's public service
      # and nobody is waiting on the result.
      REQUEST_DELAY_SECONDS: "1.0"
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
      # Read by analysis/warehouse.py, so the three analysis steps do not each
      # have to be told where the marts were built.
      WAREHOUSE_TARGET: databricks

    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the branch, not the triggering commit. A re-run of an
          # older run would otherwise land on a detached HEAD behind main and
          # fail at the push.
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest
        run: |
          python ingest/arbeitsagentur.py --max-pages 10 --with-details --detail-limit 900
          python ingest/arbeitnow.py --max-pages 5

      - name: Load and prune
        run: python load/load_raw_databricks.py

      - name: Build and test
        working-directory: dbt
        run: |
          dbt seed --profiles-dir . --target databricks
          dbt build --profiles-dir . --target databricks

      - name: Export snapshot, charts and README figures
        run: |
          python analysis/export_snapshot.py
          python analysis/make_charts.py
          python analysis/update_readme.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots analysis/charts README.md
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Daily run: $(date -u +%Y-%m-%d)"
          # main can have moved while this job ran -- it takes ten minutes and
          # nobody stops working during it. Rebase rather than fail.
          git pull --rebase origin main
          git push origin HEAD:main
