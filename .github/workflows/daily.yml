name: daily

# The point of running this on a schedule is not the data alone. It is that
# dbt's tests run every morning against a live third-party API. If the source
# changes shape -- a renamed field, a moved endpoint, an auth change -- the
# build goes red and says so, instead of the numbers quietly drifting.
#
# This used to build into a Postgres service container, which GitHub created
# empty and destroyed ten minutes later. That made every published figure one
# morning's sample: the raw layer never accumulated, so "the latest run per
# posting" and "the newest description ever fetched" had nothing to choose
# between, and the README could swing from 633 postings to 411 overnight
# because the sample moved rather than the market. It builds into Databricks
# now, which keeps thirty days and is pruned back to it by the loader.

on:
  schedule:
    # 05:40 UTC. Not on the hour: GitHub's scheduler is busiest then and
    # delays cron jobs accordingly.
    - cron: "40 5 * * *"
  workflow_dispatch:

concurrency:
  # Both workflows drive the same 2X-Small serverless warehouse -- the only one
  # a free workspace gets -- so they queue rather than run together. Never
  # cancel-in-progress here: it is not a stale build being superseded, it is a
  # job holding the warehouse, and killing it mid-write leaves a run date half
  # loaded. A parity run therefore waits for the daily one, which is the right
  # way round: the schedule is production.
  group: databricks-warehouse
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Generous because the serverless warehouse cold-starts: the first
    # statement of the day waits for compute that is not running yet. The
    # answer to a slow start is a longer timeout, not dbt wrapped in retries --
    # a retry around a build turns one honest failure into three.
    timeout-minutes: 60

    env:
      # Gentler than the local default: this is someone else's public service
      # and nobody is waiting on the result.
      REQUEST_DELAY_SECONDS: "1.0"
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
      # Read by analysis/warehouse.py, so the three analysis steps do not each
      # have to be told where the marts were built.
      WAREHOUSE_TARGET: databricks

    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the branch, not the triggering commit. A re-run of an
          # older run would otherwise land on a detached HEAD behind main and
          # fail at the push.
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --max-pages has to exceed what the terms match, not merely approach it.
      # A posting past the cap is not seen, and after posting_freshness_days
      # unseen it is counted as withdrawn. "data engineer" matched 923 on
      # 2026-09-18 -- ten pages of a hundred -- so ten would have started
      # truncating within days. Twenty is headroom; the ingest warns and
      # records it in the manifest if a term is cut off anyway.
      #
      # --detail-limit sits above the ~940 distinct postings the two terms
      # return (1,160 rows; they overlap), so a new posting has its text the
      # day it first appears.
      - name: Ingest
        run: |
          python ingest/arbeitsagentur.py --max-pages 20 --with-details --detail-limit 1200
          python ingest/arbeitnow.py --max-pages 5

      # The raw JSON lives on this runner and nowhere else until the load
      # finishes, and the runner is destroyed when the job ends. From 20 to 28
      # September the Databricks workspace was deactivated: every morning the
      # ingest succeeded, the load failed, and the day's responses were thrown
      # away with the machine. Nine runs, unrecoverable, because both APIs
      # answer with what is advertised now and never with what was advertised
      # then.
      #
      # So the responses are kept before anything downstream can fail. Ninety
      # days, the most GitHub allows, because this copy has to outlive an
      # outage nobody notices for a week, and because it is the only way the
      # scheduled runs ever reach a laptop -- the Postgres loader keeps
      # everything and does not prune.
      #
      # continue-on-error, because a backup that can stop the load would lose
      # the day it exists to protect. The step still shows red on the run.
      #
      # To restore a run date after an outage:
      #   gh run download <run-id> -n raw-<run_date> -D data/raw
      #   python load/load_raw_databricks.py --run-date <run_date>
      - name: Name the run date
        id: run
        # The ingest's own default: date.today() on a runner that is UTC.
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Keep the raw responses
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: raw-${{ steps.run.outputs.date }}
          # Relative to data/raw, so the download lands back in the layout the
          # loaders read: data/raw/<source>/<run_date>/.
          path: data/raw/
          retention-days: 90
          if-no-files-found: error
          # A rerun of the same morning replaces that morning's copy.
          overwrite: true

      - name: Load and prune
        run: python load/load_raw_databricks.py

      - name: Build and test
        working-directory: dbt
        run: |
          dbt seed --profiles-dir . --target databricks
          dbt build --profiles-dir . --target databricks

      # The site is rebuilt here, in the job that produced the data, and has no
      # schedule of its own. A separately scheduled site is one that can
      # publish yesterday's numbers while looking current.
      - name: Export snapshot, charts, README figures and the site
        run: |
          python analysis/export_snapshot.py
          python analysis/make_charts.py
          python analysis/update_readme.py
          python site/build_site.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The site's generated files by name, never docs/ whole: robots.txt,
          # favicon.svg, CNAME and docs/models are not this job's to stage.
          git add data/snapshots analysis/charts README.md \
            docs/index.html docs/sitemap.xml docs/llms.txt docs/og.png
          if git diff --staged --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "Daily run: $(date -u +%Y-%m-%d)"
          # main can have moved while this job ran -- it takes ten minutes and
          # nobody stops working during it. Rebase rather than fail.
          git pull --rebase origin main
          git push origin HEAD:main
