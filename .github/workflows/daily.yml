name: daily

# The point of running this on a schedule is not the data alone. It is that
# dbt's tests run every morning against a live third-party API. If the source
# changes shape -- a renamed field, a moved endpoint, an auth change -- the
# build goes red and says so, instead of the numbers quietly drifting.

on:
  schedule:
    # 05:40 UTC. Not on the hour: GitHub's scheduler is busiest then and
    # delays cron jobs accordingly.
    - cron: "40 5 * * *"
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobs
          POSTGRES_USER: jobs
          POSTGRES_PASSWORD: jobs
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jobs -d jobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5433
      PGDATABASE: jobs
      PGUSER: jobs
      PGPASSWORD: jobs
      # Gentler than the local default: this is someone else's public service
      # and nobody is waiting on the result.
      REQUEST_DELAY_SECONDS: "1.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest
        run: |
          python ingest/arbeitsagentur.py --max-pages 10 --with-details --detail-limit 400
          python ingest/arbeitnow.py --max-pages 5

      - name: Load
        run: python load/load_raw.py

      - name: Build and test
        working-directory: dbt
        run: |
          dbt seed --profiles-dir .
          dbt build --profiles-dir .

      - name: Export snapshot and charts
        run: |
          python analysis/export_snapshot.py
          python analysis/make_charts.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots analysis/charts
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "Daily run: $(date -u +%Y-%m-%d)"
            git push
          fi
