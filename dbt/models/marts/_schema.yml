version: 2

models:
  - name: mart_skill_frequency
    description: >
      How often each tool is named, and in what share of postings. The
      denominator is postings that HAVE a description, not all postings -
      dividing by rows that could never have matched would understate
      everything.
    columns:
      - name: skill_key
        description: Stable tool identifier.
        tests: [not_null, unique]
      - name: display_name
        description: Tool name as shown in charts and the README.
      - name: category
        description: Which kind of thing this is - cloud, language, orchestration, and so on.
      - name: postings
        description: Distinct postings whose description names this tool.
        tests: [not_null]
      - name: postings_with_text
        description: >
          The denominator, repeated on every row. Present so no percentage in
          this project can be read without the sample size beside it.
      - name: pct_of_postings
        description: postings as a share of postings_with_text.

  - name: mart_salary_by_skill
    description: >
      Advertised salary by tool, with the sample size beside every figure.
      Only a minority of postings state a salary, so tools with fewer than
      three observations are omitted entirely - a median over two postings is
      not a market rate, and publishing it as one is the failure this whole
      project exists to avoid.
    columns:
      - name: skill_key
        description: Stable tool identifier.
        tests: [not_null, unique]
      - name: display_name
        description: Tool name.
      - name: category
        description: Tool category.
      - name: postings_with_salary
        description: >
          How many postings backed this row. Read every figure here against
          this number; at these sample sizes, differences between tools are
          not meaningful.
        tests: [not_null]
      - name: median_salary_from
        description: Median lower bound of the advertised range.
      - name: median_salary_to
        description: Median upper bound of the advertised range.
      - name: min_salary_from
        description: Lowest advertised lower bound.
      - name: max_salary_to
        description: Highest advertised upper bound.

  - name: mart_city_stats
    description: >
      Where the roles are and what they pay there. Cities with a single
      posting are omitted; one posting is not a local market.
    columns:
      - name: city
        description: City as the source recorded it, not normalised.
      - name: region
        description: Federal state, where known.
      - name: postings
        description: Postings in this city.
      - name: home_office_postings
        description: How many of them allow home office.
      - name: postings_with_salary
        description: How many state a salary - the denominator for the median beside it.
      - name: median_salary_from
        description: >
          Median advertised lower bound, over plausible annual figures only.
          Monthly and hourly figures are excluded by range rather than trusted.

  - name: mart_language_requirement
    description: >
      How much of the German market is gated on German. Measured only over
      postings with a real description, and only where an explicit competency
      phrase appears - so the figure is a floor, not a ceiling. Per-source
      rows are suppressed below a minimum sample size; the ALL row always
      reports.
    columns:
      - name: population
        description: >
          A source name, or ALL. Sources appear only above the minimum sample
          size, because a percentage over a dozen postings printed beside one
          over six hundred reads as a comparison when it is not one.
        tests: [not_null, unique]
      - name: postings
        description: Postings with a usable description in this population.
        tests: [not_null]
      - name: requires_german
        description: Postings stating an explicit German-competency requirement.
      - name: mentions_english
        description: Postings mentioning English at all.
      - name: english_without_german
        description: >
          Postings mentioning English and stating no German requirement. The
          closest thing this data has to "reachable without German".
      - name: pct_requires_german
        description: requires_german as a share of postings.
      - name: pct_english_without_german
        description: english_without_german as a share of postings.

  - name: mart_pipeline_funnel
    description: >
      How many rows survive each stage, in the order int_postings applies
      them. The README publishes the last stage; this says what the other
      seven cost. Without it, a total that moves overnight could be fewer
      postings ingested, more filtered out of scope, more aged past the
      freshness window, more collapsed by deduplication, or simply fewer
      descriptions fetched - five different problems that look identical from
      the outside. Every stage but the first counts int_postings_scored, the
      model int_postings filters, so the funnel cannot disagree with the
      number it explains.
    columns:
      - name: stage_order
        description: Position in the pipeline. The order the model applies, not a ranking.
        tests: [not_null]
      - name: stage
        description: >
          What this stage keeps. Named for the surviving set rather than for
          the filter, so the column reads as a count of something real.
        tests:
          - not_null
          - unique
          - accepted_values:
              values:
                - rows_read
                - distinct_postings
                - title_in_scope
                - in_germany
                - latest_snapshot
                - still_advertised
                - deduplicated
                - with_description
      - name: postings
        description: >
          Rows surviving this stage. Stage 1 is read from the loader's
          manifest, because the grain collapses duplicates in load/rows.py
          before anything reaches the warehouse and no model can count what
          was read. It is a floor rather than an exact count while any run
          loaded before that field existed is still inside the retention
          window: those runs fall back to what survived the grain, which
          understates them rather than inventing a number.
        tests: [not_null, non_negative]
      - name: pct_of_previous
        description: >
          What this stage kept of the stage above it. Answers "what did this
          filter cost".
      - name: pct_of_first
        description: >
          What this stage kept of the rows originally read. Answers "what is
          left of what we started with". Kept separate from pct_of_previous
          because a reader who takes one for the other reads a 94% stage as a
          94% survival rate.
      - name: dropped
        description: Rows this stage removed. Null on the first stage, which removes nothing.
