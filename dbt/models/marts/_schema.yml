version: 2

models:
  - name: int_postings
    description: One row per distinct posting, sources combined and deduplicated.
    columns:
      - name: posting_id
        tests: [not_null]
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["arbeitsagentur", "arbeitnow"]
      - name: title
        tests: [not_null]
      - name: country
        description: >
          Always DEUTSCHLAND. Federal rows state it; Arbeitnow rows have it
          resolved from location text. Anything else here, null included,
          means the scope filter has stopped working.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["DEUTSCHLAND"]

  - name: int_german_cities
    description: German place names derived from the federal database, used to
      validate the second source's free-text locations.
    columns:
      - name: city_norm
        tests: [not_null, unique]

  - name: int_arbeitnow_geo
    description: Country resolved per Arbeitnow posting - DEUTSCHLAND, FOREIGN,
      or null where the location says only "Remote".
    columns:
      - name: posting_id
        tests: [not_null, unique]
      - name: resolved_country
        tests:
          - accepted_values:
              arguments:
                values: ["DEUTSCHLAND", "FOREIGN"]

  - name: int_posting_skills
    description: One row per posting-skill mention.
    columns:
      - name: posting_id
        tests: [not_null]
      - name: skill_key
        tests:
          - not_null
          - relationships:
              to: ref('skills')
              field: skill_key

  - name: mart_skill_frequency
    description: Tool mention counts and share of postings.
    columns:
      - name: skill_key
        tests: [not_null, unique]
      - name: postings
        tests: [not_null]

  - name: mart_salary_by_skill
    description: Advertised salary by tool, with the sample size beside it.
    columns:
      - name: skill_key
        tests: [not_null, unique]
      - name: postings_with_salary
        tests: [not_null]

  - name: mart_city_stats
    description: Posting counts and advertised salary by city.

  - name: mart_language_requirement
    description: >
      Share of postings that explicitly require German. Per-source rows appear
      only above a minimum sample size; the ALL row always reports.
    columns:
      - name: population
        tests: [not_null, unique]
      - name: postings
        tests: [not_null]
