# Kept in the repo, not ~/.dbt. Defaults match docker-compose.
# Targets: dev (Postgres, default) and databricks. dbt does not read .env:
#     set -a; source .env; set +a
#     dbt build --profiles-dir . --target databricks
de_jobs:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5433') | int }}"
      user: "{{ env_var('PGUSER', 'jobs') }}"
      password: "{{ env_var('PGPASSWORD', 'jobs') }}"
      dbname: "{{ env_var('PGDATABASE', 'jobs') }}"
      schema: analytics
      threads: 4

    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'workspace') }}"
      # Overridden by the fixture run so it cannot touch the analytics_* tables.
      schema: "{{ env_var('DATABRICKS_SCHEMA', 'analytics') }}"
      threads: 4
