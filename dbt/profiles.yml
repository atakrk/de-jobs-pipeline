# Kept in the repo rather than ~/.dbt so the project is self-contained.
# Credentials come from the environment; the defaults match docker-compose.
#
# Two targets. `dev` is Postgres and is the default, so a local build needs no
# flags and no credentials beyond docker-compose. `databricks` is production:
# the daily schedule runs it, the published figures come from it, and it keeps
# thirty days where a local Postgres keeps whatever you last loaded.
#
# Credentials come from the environment. dbt does not read .env, so export
# them first:
#
#     set -a; source .env; set +a
#     dbt build --profiles-dir . --target databricks
#
de_jobs:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5433') | int }}"
      user: "{{ env_var('PGUSER', 'jobs') }}"
      password: "{{ env_var('PGPASSWORD', 'jobs') }}"
      dbname: "{{ env_var('PGDATABASE', 'jobs') }}"
      schema: analytics
      threads: 4

    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'workspace') }}"
      # The fixture gate builds in the same workspace as production and must
      # not be able to reach its tables. Overriding this moves every model
      # into <schema>_staging / _intermediate / _marts, away from analytics_*.
      schema: "{{ env_var('DATABRICKS_SCHEMA', 'analytics') }}"
      threads: 4
