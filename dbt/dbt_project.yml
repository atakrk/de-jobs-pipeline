name: de_jobs
version: "1.0.0"
config-version: 2
profile: de_jobs

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# How recently a posting must have been seen to count as currently advertised.
# Deliberately separate from the warehouse retention window: retention is a
# storage bound, this is a definition. See int_postings and CLAUDE.md.
vars:
  posting_freshness_days: 7
  # Shortest description worth reading requirements from. Stub listings that
  # only link elsewhere would otherwise count as postings with no tools named,
  # understating every rate. Read by int_postings_scored.has_description and by
  # the denominator mart_skill_frequency publishes against.
  description_min_chars: 200

models:
  de_jobs:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  de_jobs:
    +schema: seeds
    skills:
      # Pinned because seed types are inferred from the file: Postgres would
      # size a varchar to the longest pattern present today, so adding a
      # longer regex would stop being a one-line data change.
      #
      # The platform difference is spelled here rather than in
      # macros/dialect.sql -- the one exception to that rule -- because
      # dbt_project.yml is rendered without macros in scope. The lookup is a
      # mapping rather than a conditional so an unknown adapter fails to
      # render instead of silently taking the Postgres spelling, which is the
      # same guarantee the dialect macros give by raising.
      +column_types:
        skill_key: &seed_text "{{ {'postgres': 'text', 'databricks': 'string'}[target.type] }}"
        display_name: *seed_text
        category: *seed_text
        pattern: *seed_text
