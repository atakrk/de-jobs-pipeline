name: de_jobs
version: "1.0.0"
config-version: 2
profile: de_jobs

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Days since last seen for a posting to count as advertised (not the 30-day retention).
vars:
  posting_freshness_days: 7
  # Shorter descriptions are stubs and don't count as having text.
  description_min_chars: 200

models:
  de_jobs:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  de_jobs:
    +schema: seeds
    # Recreate seeds each run so an added column doesn't fail; they are tiny.
    +full_refresh: true
    skills:
      # Pin text types so a longer pattern doesn't overflow an inferred varchar.
      # Spelled here, not in dialect.sql (no macros in this file); unknown adapter fails.
      +column_types:
        skill_key: &seed_text "{{ {'postgres': 'text', 'databricks': 'string'}[target.type] }}"
        display_name: *seed_text
        category: *seed_text
        pattern: *seed_text
